name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build EXE with PyInstaller
        run: pyinstaller --onefile --noconsole --name StreamScanner streamscanner.py

      - name: Ensure NSIS is available
        shell: pwsh
        run: |
          $candidates = @(
            "C:\Program Files (x86)\NSIS\makensis.exe",
            "C:\Program Files\NSIS\makensis.exe"
          )
          $exe = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $exe) {
            Write-Host "NSIS not preinstalled; installing via winget..."
            winget install --id NSIS.NSIS -e --silent --accept-package-agreements --accept-source-agreements
            if ($LASTEXITCODE -ne 0) { throw "winget install NSIS failed (exit $LASTEXITCODE)" }
            $exe = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          }
          if (-not $exe) { throw "makensis.exe not found after install attempt" }
          Write-Host "Using makensis: $exe"
          & $exe /VERSION
          (Split-Path $exe) | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Build installer
        shell: pwsh
        run: |
          $log = Join-Path $env:GITHUB_WORKSPACE "makensis.log"
          function Find-Makensis {
            $c = @("C:\Program Files (x86)\NSIS\makensis.exe", "C:\Program Files\NSIS\makensis.exe")
            $f = $c | Where-Object { Test-Path $_ } | Select-Object -First 1
            if ($f) { return $f }
            $cmd = Get-Command makensis -ErrorAction SilentlyContinue
            if ($cmd) { return $cmd.Source }
            return $null
          }
          $mk = Find-Makensis
          if (-not $mk) { throw "makensis.exe not found" }
          Write-Host "makensis: $mk"
          $ver = "${{ github.ref_name }}".TrimStart("v")
          if (-not $ver -or $ver -eq "main") { $ver = "1.0.0" }
          Write-Host "version: $ver"
          $exePath = Join-Path $env:GITHUB_WORKSPACE "dist\StreamScanner.exe"
          $outPath = Join-Path $env:GITHUB_WORKSPACE "installer\StreamScanner-Setup.exe"
          Write-Host "exe: $exePath (exists: $(Test-Path $exePath))"
          & $mk /DVERSION=$ver "/DEXE_PATH=$exePath" "/DOUT_PATH=$outPath" installer/installer.nsi 2>&1 | Tee-Object -FilePath $log
          if ($LASTEXITCODE -ne 0) { throw "makensis exited with code $LASTEXITCODE (see makensis.log artifact)" }

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: makensis-log-${{ github.ref_name }}
          path: makensis.log
          if-no-files-found: warn

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: StreamScanner-${{ github.ref_name }}
          path: |
            dist/StreamScanner.exe
            installer/StreamScanner-Setup.exe

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" \
            "installer/StreamScanner-Setup.exe" \
            --title "${{ github.ref_name }}" \
            --generate-notes
