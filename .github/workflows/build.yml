name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build EXE with PyInstaller
        run: pyinstaller --onefile --noconsole --name MasterStreamScanner masterstream_scanner.py

      - name: Ensure NSIS is available
        shell: pwsh
        run: |
          $nsis = "C:\Program Files (x86)\NSIS\makensis.exe"
          if (-not (Test-Path $nsis)) {
            choco install nsis -y --no-progress
          }
          & $nsis -VERSION

      - name: Build installer
        shell: pwsh
        run: |
          $ver = "${{ github.ref_name }}".TrimStart("v")
          if (-not $ver -or $ver -eq "main") { $ver = "1.0.0" }
          & "C:\Program Files (x86)\NSIS\makensis.exe" /DVERSION=$ver installer/installer.nsi

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: MasterStreamScanner-${{ github.ref_name }}
          path: |
            dist/MasterStreamScanner.exe
            installer/MasterStreamScanner-Setup.exe

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" \
            "installer/MasterStreamScanner-Setup.exe" \
            --title "${{ github.ref_name }}" \
            --generate-notes
